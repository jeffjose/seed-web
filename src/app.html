<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// As the system has it is the default: with no stored preference the page is
			// light or dark as the system is. Runs before first paint so there is no flash.
			try {
				// A named look is light or dark as it was when it was chosen (kept beside it), and says which it is.
				const t = localStorage.getItem("theme");
				const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
				const named = t && t !== "system" && t !== "dark" && t !== "light";
				const dark = !t || t === "system" ? systemDark : named ? localStorage.getItem("theme:dark") !== "0" : t !== "light";
				document.documentElement.classList.toggle("dark", dark);
				if (named) document.documentElement.dataset.theme = t;
				// The face it is set in, where one was chosen (`fonts.ts`): asked for now, so that the page does not come up in one and change to another.
				// (Which face it is is said on the page, for what is set differently in one: `app.css`.)
				document.documentElement.dataset.font = localStorage.getItem("font") || "geist";
				const family = localStorage.getItem("font:family");
				const href = localStorage.getItem("font:href");
				if (family && /^[\w '\-,]+$/.test(family)) {
					document.documentElement.style.setProperty("--app-font", family);
					if (href && href.indexOf("https://fonts.googleapis.com/css2?") === 0) {
						const link = document.createElement("link");
						link.id = "app-font";
						link.rel = "stylesheet";
						link.href = href;
						document.head.appendChild(link);
					}
				}
			} catch (e) {}
		</script>
		<!-- The page is its own color from the first thing drawn, before any of its styles have come: not white, and then dark. (The two pages of `app.css`.) -->
		<style>
			html { background: oklch(0.986 0.003 140); }
			html.dark { background: oklch(0.179 0.0041 286); }
		</style>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<title>Title</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
